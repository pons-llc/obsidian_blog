<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}{{ config.SITE_NAME }}{% endblock %}</title>
    <meta name="description" content="{% block meta_description %}{% endblock %}">
    <meta property="og:site_name" content="{{ config.SITE_NAME }}">
    <meta property="og:title" content="{% block og_title %}{{ config.SITE_NAME }}{% endblock %}">
    <meta property="og:description" content="{% block og_description %}{% endblock %}">
    <meta property="og:type" content="{% block og_type %}website{% endblock %}">
    <meta name="twitter:card" content="summary_large_image">
    {% block og_image %}{% endblock %}
    {% if config.SITE_URL %}<link rel="sitemap" type="application/xml" href="{{ url_for('sitemap') }}">{% endif %}
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>
    <header>
        <a href="{{ url_for('index') }}" class="site-title">{{ config.SITE_NAME }}</a>
        <nav><a href="{{ url_for('search') }}">検索</a></nav>
    </header>
    <main>
        {% block content %}{% endblock %}
    </main>
    <footer>
        <p>Generated with Flask-Frozen</p>
    </footer>
</body>
</html>
